<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손맛분식 고객응대 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316', // Primary Warm Orange
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar style */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #fff7ed;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #fed7aa;
            border-radius: 10px;
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #fdba74;
        }
        /* Animation for subtle message pop-in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-bubble {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 font-sans h-screen flex justify-center items-center p-0 md:p-4 selection:bg-brand-200">

    <!-- Mobile container shell -->
    <div class="w-full max-w-md h-full md:h-[92vh] bg-amber-50/50 md:bg-white md:shadow-2xl md:rounded-3xl flex flex-col overflow-hidden border border-amber-100">

        <!-- Header -->
        <header class="bg-gradient-to-r from-brand-500 to-amber-500 text-white p-4 shadow-md shrink-0 relative z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-white text-brand-600 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-inner border border-amber-200">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight flex items-center gap-2">
                            손맛분식
                            <span class="text-xs bg-amber-100/30 text-white px-2 py-0.5 rounded-full font-normal backdrop-blur-sm border border-white/20">챗봇</span>
                        </h1>
                        <p class="text-xs text-amber-100 flex items-center gap-1 mt-0.5">
                            <i class="fa-solid fa-location-dot text-amber-200"></i> 달빛시장 3번 골목
                        </p>
                    </div>
                </div>
                <button onclick="resetChat()" title="대화 초기화" class="p-2 text-amber-100 hover:text-white transition-colors rounded-lg hover:bg-white/10 active:scale-95">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>
            </div>

            <!-- Business hours banner -->
            <div class="mt-3 bg-brand-600/40 rounded-xl p-2.5 text-xs border border-white/15 flex items-center gap-2 text-amber-50">
                <i class="fa-regular fa-clock text-amber-200 text-sm shrink-0"></i>
                <div class="leading-snug truncate">
                    <span class="font-medium text-white">평일</span> 10~20시 <span class="opacity-60">|</span> 
                    <span class="font-medium text-white">토</span> 10~21시 <span class="opacity-60">|</span> 
                    <span class="text-amber-200 font-medium">일요일 휴무</span>
                </div>
            </div>
        </header>

        <!-- Quick Action Buttons -->
        <div class="bg-white/80 backdrop-blur-md px-3 py-2.5 border-b border-amber-100 shrink-0 overflow-x-auto">
            <p class="text-[11px] font-semibold text-amber-800/60 mb-1.5 px-1 flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles text-brand-500"></i> 자주 묻는 질문
            </p>
            <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
                <button onclick="askQuickQuestion('몇 시까지 하세요?')" class="bg-amber-100/70 hover:bg-brand-500 hover:text-white text-amber-900 px-3 py-1.5 rounded-full whitespace-nowrap transition-all shadow-sm active:scale-95 flex items-center gap-1 shrink-0 border border-amber-200/60">
                    ⏰ 영업시간
                </button>
                <button onclick="askQuickQuestion('어디에 있나요?')" class="bg-amber-100/70 hover:bg-brand-500 hover:text-white text-amber-900 px-3 py-1.5 rounded-full whitespace-nowrap transition-all shadow-sm active:scale-95 flex items-center gap-1 shrink-0 border border-amber-200/60">
                    📍 위치안내
                </button>
                <button onclick="askQuickQuestion('대표 메뉴가 뭔가요?')" class="bg-amber-100/70 hover:bg-brand-500 hover:text-white text-amber-900 px-3 py-1.5 rounded-full whitespace-nowrap transition-all shadow-sm active:scale-95 flex items-center gap-1 shrink-0 border border-amber-200/60">
                    🍢 추천메뉴
                </button>
                <button onclick="askQuickQuestion('주차장이 있나요?')" class="bg-amber-100/70 hover:bg-brand-500 hover:text-white text-amber-900 px-3 py-1.5 rounded-full whitespace-nowrap transition-all shadow-sm active:scale-95 flex items-center gap-1 shrink-0 border border-amber-200/60">
                    🅿️ 주차안내
                </button>
            </div>
        </div>

        <!-- Chat History -->
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4 bg-orange-50/30">
            
            <!-- Welcome Bot Message -->
            <div class="flex gap-2.5 message-bubble">
                <div class="w-9 h-9 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-md shrink-0 border border-brand-400">
                    손
                </div>
                <div class="max-w-[80%]">
                    <div class="text-[11px] text-gray-500 mb-1 ml-1 font-medium">손맛분식 도우미</div>
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-amber-100 text-sm text-slate-800 leading-relaxed">
                        안녕하세요! 정성 가득 달빛시장 <span class="font-semibold text-brand-600">손맛분식</span>입니다. 😊<br><br>
                        영업시간, 위치, 메뉴 등 궁금하신 점을 편하게 물어보세요!
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Input Bar -->
        <footer class="p-3 bg-white border-t border-amber-100 shrink-0">
            <form id="chat-form" onsubmit="handleUserSubmit(event)" class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="질문을 입력하세요..." 
                    autocomplete="off"
                    class="flex-1 px-4 py-3 bg-amber-50/60 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all placeholder:text-amber-800/40"
                >
                <button 
                    type="submit" 
                    class="w-11 h-11 bg-brand-500 hover:bg-brand-600 text-white rounded-2xl flex items-center justify-center shadow-md shadow-brand-500/20 active:scale-95 transition-all shrink-0"
                    title="전송"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </footer>

    </div>

    <script>
        // FAQ Data Engine
        const faqList = [
            {
                id: 1,
                keywords: ["몇시", "몇 시", "언제까지", "영업시간", "오픈시간", "오픈 시간", "닫는시간", "닫는 시간", "끝나는시간", "휴무", "쉬나요", "쉬는날", "영업"],
                questions: ["몇 시까지 하세요?", "언제까지 해요?", "영업시간", "오픈 시간"],
                answer: "평일은 10시부터 20시까지, 토요일은 21시까지입니다. 일요일은 쉽니다."
            },
            {
                id: 2,
                keywords: ["어디", "위치", "찾아가는", "길", "주소", "찾아가", "어디에"],
                questions: ["어디에 있나요?", "위치가 어디예요?", "찾아가는 길", "위치"],
                answer: "달빛시장 3번 골목 중간에 위치해 있습니다. (주황색 간판을 찾아주세요!)"
            },
            {
                id: 3,
                keywords: ["대표", "메뉴", "맛있는", "추천", "떡볶이", "튀김", "순대", "뭐가", "뭐가제일"],
                questions: ["대표 메뉴가 뭔가요?", "제일 맛있는 게 뭐예요?", "추천 메뉴", "메뉴"],
                answer: "매콤달콤한 옛날 떡볶이와 바삭한 모듬튀김, 찰순대가 대표 메뉴입니다."
            },
            {
                id: 4,
                keywords: ["포장", "배달", "택배", "밀키트", "싸갈수"],
                questions: ["포장이나 배달 되나요?", "포장 가능해요?", "배달돼요?"],
                answer: "모든 메뉴 포장 가능합니다! 근거리 배달 및 전국 택배(밀키트)는 매장으로 전화 문의해 주세요."
            },
            {
                id: 5,
                keywords: ["주차", "주차장", "차", "주차권", "공영주차장"],
                questions: ["주차장이 있나요?", "주차 되나요?", "주차"],
                answer: "달빛시장 공영주차장을 이용하시면 1시간 무료 주차권을 지원해 드립니다."
            },
            {
                id: 6,
                keywords: ["예약", "단체", "전화주문", "미리"],
                questions: ["예약이 가능한가요?", "단체 예약", "예약"],
                answer: "전화로 미리 주문하시거나 단체 예약 가능합니다. Peak 시간대에는 사전 문의 부탁드립니다."
            },
            {
                id: 7,
                keywords: ["결제", "온누리", "상품권", "카드", "제로페이", "현금", "지역사랑", "돈"],
                questions: ["결제 수단은 뭐가 되나요?", "온누리상품권 돼요?", "카드 되나요?", "제로페이"],
                answer: "현금, 신용카드, 온누리상품권, 제로페이, 지역사랑상품권 모두 사용 가능합니다."
            },
            {
                id: 8,
                keywords: ["밀키트", "택배", "양념장", "떡", "택배판매"],
                questions: ["밀키트 판매도 하나요?", "택배 되나요?"],
                answer: "네! 손맛분식 떡볶이 양념장과 떡 밀키트를 매장 및 전화 주문으로 구매하실 수 있습니다."
            },
            {
                id: 9,
                keywords: ["튀김", "김말이", "오징어", "고구마", "야채", "만두"],
                questions: ["튀김 종류는 뭐가 있나요?", "튀김 메뉴"],
                answer: "김말이, 오징어, 고구마, 야채, 만두 튀김이 있으며, 매일 깨끗한 기름으로 바삭하게 튀깁니다."
            },
            {
                id: 10,
                keywords: ["원산지", "재료", "국산", "고춧가루", "국내산", "어디산"],
                questions: ["원산지 표시", "재료는 어디 산인가요?"],
                answer: "떡볶이 떡과 고춧가루는 100% 국산 농산물만을 사용하며, 정성을 다해 만듭니다."
            }
        ];

        const FALLBACK_RESPONSE = "확인이 어렵습니다. 사장님께 직접 여쭤봐 주세요";

        // Simple Keyword Matching & Similarity Algorithm
        function findBestAnswer(userInput) {
            const cleanInput = userInput.trim().toLowerCase().replace(/[^\w\sㄱ-ㅎ가-힣]/g, '');
            if (!cleanInput) return null;

            let bestMatch = null;
            let maxScore = 0;

            faqList.forEach(faq => {
                let score = 0;

                // 1. Check exact phrasing match in standard questions
                faq.questions.forEach(q => {
                    const cleanQ = q.toLowerCase().replace(/[^\w\sㄱ-ㅎ가-힣]/g, '');
                    if (cleanInput === cleanQ) score += 10;
                    else if (cleanInput.includes(cleanQ) || cleanQ.includes(cleanInput)) score += 5;
                });

                // 2. Keyword overlap score
                faq.keywords.forEach(keyword => {
                    const cleanKw = keyword.toLowerCase();
                    if (cleanInput.includes(cleanKw)) {
                        score += 3;
                    }
                });

                if (score > maxScore) {
                    maxScore = score;
                    bestMatch = faq.answer;
                }
            });

            // Return answer only if score passes strict threshold
            return maxScore >= 3 ? bestMatch : FALLBACK_RESPONSE;
        }

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        // Scroll chat to bottom
        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        // Render user message bubble
        function appendUserMessage(message) {
            const messageHtml = `
                <div class="flex justify-end message-bubble">
                    <div class="max-w-[80%]">
                        <div class="bg-brand-500 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-sm leading-relaxed">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();
        }

        // Render bot message bubble
        function appendBotMessage(message) {
            const messageHtml = `
                <div class="flex gap-2.5 message-bubble">
                    <div class="w-9 h-9 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-md shrink-0 border border-brand-400">
                        손
                    </div>
                    <div class="max-w-[80%]">
                        <div class="text-[11px] text-gray-500 mb-1 ml-1 font-medium">손맛분식 도우미</div>
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-amber-100 text-sm text-slate-800 leading-relaxed">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();
        }

        // Handle question submission
        function handleUserSubmit(event) {
            if (event) event.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Display User Message
            appendUserMessage(text);
            userInput.value = '';

            // Get bot answer from strict FAQ matcher
            const botAnswer = findBestAnswer(text);

            // Simulate slight delay for natural feeling
            setTimeout(() => {
                appendBotMessage(botAnswer);
            }, 300);
        }

        // Trigger Quick FAQ Button
        function askQuickQuestion(questionText) {
            userInput.value = questionText;
            handleUserSubmit();
        }

        // Reset chat history
        function resetChat() {
            chatContainer.innerHTML = `
                <div class="flex gap-2.5 message-bubble">
                    <div class="w-9 h-9 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-md shrink-0 border border-brand-400">
                        손
                    </div>
                    <div class="max-w-[80%]">
                        <div class="text-[11px] text-gray-500 mb-1 ml-1 font-medium">손맛분식 도우미</div>
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-amber-100 text-sm text-slate-800 leading-relaxed">
                            안녕하세요! 정성 가득 달빛시장 <span class="font-semibold text-brand-600">손맛분식</span>입니다. 😊<br><br>
                            영업시간, 위치, 메뉴 등 궁금하신 점을 편하게 물어보세요!
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper: Prevent HTML injection
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
